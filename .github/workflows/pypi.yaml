name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install "build==1.6.1"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check sdist and wheel
        # Same check as the package job in ci.yml, on exactly the files that get uploaded, plus the
        # tag/version match. The tag goes through env:, never inline into the script.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_dist.py dist --version "${RELEASE_TAG#v}"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aiocomexio-dist-${{ github.event.release.tag_name }}
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aiocomexio/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aiocomexio-dist-${{ github.event.release.tag_name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
